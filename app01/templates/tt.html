{% extends 'layout.html' %}

{% block content %}
<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title">头像预览（选择图片后本地预览，再提交上传）</h3>
    </div>
    <div class="panel-body">
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            <div style="height:120px;width:120px;padding:2px;border:1px solid #ddd;position:relative;background:#f4f6f9;">
                <img id="previewImg" style="height:100%;width:100%;object-fit:cover;display:block;"
                     src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'></svg>">
                <input id="avatarImg" name="image" type="file"
                       style="top:0;left:0;right:0;bottom:0;opacity:0;position:absolute;z-index:102;">
            </div>
            <div style="margin-top:18px;">
                {% for field in form %}
                    {% if field.name != 'image' %}
                    <div class="form-group">
                        <label>{{ field.label }}</label>
                        {{ field }}
                        <span style="color:red;">{{ field.errors.0 }}</span>
                    </div>
                    {% endif %}
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-primary">提 交</button>
        </form>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
$(function () {
    $('#avatarImg').change(function () {
        var file_obj = this.files[0];
        if (!file_obj) { return; }
        var reader = new FileReader();
        reader.readAsDataURL(file_obj);
        reader.onload = function (e) {
            $('#previewImg').attr('src', e.target.result);
        };
    });
});
</script>
{% endblock %}
