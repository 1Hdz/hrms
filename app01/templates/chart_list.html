{% extends 'layout.html' %}
{% load static %}

{% block content %}
<div class="panel panel-default">
    <div class="panel-heading">折线图（分公司业绩）</div>
    <div class="panel-body">
        <div id="m1" style="width:100%;height:300px;"></div>
    </div>
</div>

<div class="row">
    <div class="col-sm-8">
        <div class="panel panel-default">
            <div class="panel-heading">柱状图（员工业绩月度汇总）</div>
            <div class="panel-body">
                <div id="m2" style="width:100%;height:400px;"></div>
            </div>
        </div>
    </div>
    <div class="col-sm-4">
        <div class="panel panel-default">
            <div class="panel-heading">饼图（部门预算占比）</div>
            <div class="panel-body">
                <div id="m3" style="width:100%;height:400px;"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script src="{% static 'js/echarts.min.js' %}"></script>
<script>
$(function () {
    initLine();
    initBar();
    initPie();
});

// 折线图
function initLine() {
    var myChart = echarts.init(document.getElementById('m1'));
    var option = {
        title: {text: '分公司业绩图', left: 'center'},
        tooltip: {trigger: 'axis'},
        legend: {bottom: 0, data: []},
        toolbox: {feature: {saveAsImage: {}}},
        xAxis: {type: 'category', boundaryGap: false, data: []},
        yAxis: {type: 'value'},
        series: []
    };
    $.ajax({
        url: '/chart/line/', type: 'GET', dataType: 'JSON',
        success: function (res) {
            if (res.status) {
                option.legend.data = res.data.legend;
                option.xAxis.data = res.data.x_axis;
                option.series = res.data.series_list;
                myChart.setOption(option);
            }
        }
    });
}

// 柱状图
function initBar() {
    var myChart = echarts.init(document.getElementById('m2'));
    var option = {
        title: {text: '员工业绩月度汇总', left: 'center'},
        tooltip: {},
        legend: {bottom: 0, data: []},
        xAxis: {data: []},
        yAxis: {},
        series: []
    };
    $.ajax({
        url: '/chart/bar/', type: 'GET', dataType: 'JSON',
        success: function (res) {
            if (res.status) {
                option.legend.data = res.data.legend;
                option.xAxis.data = res.data.x_axis;
                option.series = res.data.series_list;
                myChart.setOption(option);
            }
        }
    });
}

// 饼图
function initPie() {
    var myChart = echarts.init(document.getElementById('m3'));
    var option = {
        title: {text: '部门预算占比', left: 'center'},
        tooltip: {trigger: 'item'},
        legend: {bottom: 0},
        series: [{
            name: '预算', type: 'pie', radius: '50%',
            data: [],
            emphasis: {
                itemStyle: {shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,0.5)'}
            }
        }]
    };
    $.ajax({
        url: '/chart/pie/', type: 'GET', dataType: 'JSON',
        success: function (res) {
            if (res.status) {
                option.series[0].data = res.data;
                myChart.setOption(option);
            }
        }
    });
}
</script>
{% endblock %}
